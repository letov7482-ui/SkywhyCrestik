<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>SkyWhy by Midpoint</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Экран загрузки -->
    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">ЗАГРУЗКА SKYWHY...</div>
    </div>

    <!-- Главное Меню -->
    <div id="main-menu">
        <div class="menu-left">
            <div>
                <h1>SkyWhy</h1>
                <div class="author">by Midpoint</div>
            </div>
            <div class="btn-list">
                <button class="menu-btn" id="btn-notif">📢 Уведомления</button>
                <button class="menu-btn" id="btn-shop">🛒 Магазин & Кейсы</button>
                <button class="menu-btn" id="btn-settings">⚙️ Настройки</button>
            </div>
            <div class="version">Версия 1.0.0</div>
        </div>
        <div class="menu-right">
            <div class="start-zone">
                <select id="mode-select">
                    <option value="easy">Обучение</option>
                    <option value="classic">Классический хоррор</option>
                    <option value="hardcore">Кошмар (Midpoint Mode)</option>
                </select>
                <button id="start-btn">ИГРАТЬ</button>
            </div>
        </div>
    </div>

    <!-- Настройки -->
    <div id="win-settings" class="window">
        <div class="window-header"><h2>НАСТРОЙКИ</h2><span class="close-btn">&times;</span></div>
        <div class="setting-row"><span>Пол:</span><select id="set-gender"><option value="male">Мужской</option><option value="female">Женский</option></select></div>
        <div class="setting-row"><span>FPS:</span><select id="set-fps"><option value="60">60 FPS</option><option value="45">45 FPS</option></select></div>
        <div class="setting-row"><span>Чувствительность:</span><input type="range" id="set-sens" min="1" max="10" value="5"></div>
        <div class="setting-row"><span>Звук криков:</span><input type="range" id="set-vol" min="0" max="100" value="80"></div>
    </div>

    <!-- Магазин -->
    <div id="win-shop" class="window">
        <div class="window-header"><h2>МАГАЗИН КЕЙСОВ</h2><span class="close-btn">&times;</span></div>
        <div class="shop-grid">
            <div class="shop-item"><h3>Кейс «Midpoint»</h3><button>Открыть</button></div>
        </div>
    </div>

    <!-- Уведомления -->
    <div id="win-notif" class="window">
        <div class="window-header"><h2>МИССИИ</h2><span class="close-btn">&times;</span></div>
        <p>• Исследуйте локацию SkyWhy и выживите.</p>
    </div>

    <!-- Игровой интерфейс -->
    <div id="game-ui">
        <div class="game-stat">🔋 ФОНАРИК: 100% | 💰 МОНЕТЫ: 120</div>
        <div id="fps-counter">FPS: --</div>
        <div id="subtitles"></div>
        <div id="joystick"><div id="stick"></div></div>
        <div id="action-btn">ИСКАТЬ</div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
