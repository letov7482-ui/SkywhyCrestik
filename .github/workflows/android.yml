name: "Build skywhy crestik"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Обязательно ставим .NET SDK, так как у нас проект на C#
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      # 2. Настраиваем Java для Android
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Настраиваем Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Профессиональный экшен: он САМ скачает и настроит Godot 4.3 .NET и все шаблоны без ошибок!
      - name: Setup Godot Engine & Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: true
          include-templates: true

      # 5. Прописываем внутренние пути SDK в настройки редактора
      - name: Configure Godot Editor Settings for Android
        run: |
          mkdir -p ~/.config/godot
          echo "[settings]" > ~/.config/godot/editor_settings-4.tres
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/shutdown_adb_on_exit = true" >> ~/.config/godot/editor_settings-4.tres

      # 6. Создаем заглушку иконки, если её нет
      - name: Generate Dummy Icon
        run: |
          if [ ! -f icon.svg ]; then
            echo '<svg xmlns="http://w3.org" width="128" height="128"><rect width="128" height="128" fill="#ff0000"/></svg>' > icon.svg
          fi

      # 7. Запуск сборки APK-файла
      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/skywhy_crestik.apk

      # 8. Выкладываем готовый файл для твоего Redmi Note 12
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: skywhy-crestik-apk
          path: build/android/skywhy_crestik.apk
          retention-days: 7
          
