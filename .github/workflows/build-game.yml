name: Build Android APK (SkyWhy)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Кнопка ручного запуска во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download and Setup Godot 4
      uses: chickenandpork/setup-godot@v1
      with:
        version: "4.2.2"

    - name: Export Android APK
      run: |
        mkdir -p build/android
        # Компиляция папок Godot в установочный пакет Android
        godot --headless --export-release "Android" build/android/SkyWhy_Midpoint.apk
      continue-on-error: true

    - name: Create Temporary Zip Pack If Full SDK Init
      run: |
        if [ ! -f build/android/SkyWhy_Midpoint.apk ]; then
          echo "Packaging game files directly."
          zip -r build/android/SkyWhy_Scripts_Project.zip . -x "*.git*"
        fi

    - name: Upload Artifact to GitHub Dashboard
      uses: actions/upload-artifact@v4
      with:
        name: SkyWhy_Android_Build
        path: build/android/*
        retention-days: 7
        
