name: Build Android APK (SkyWhy)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Кнопка ручного запуска во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download and Setup Godot 4
      # ИСПРАВЛЕНО: Используем официальный актуальный репозиторий компилятора
      uses: chickensoft-games/setup-godot@v2
      with:
        version: "4.2.2"
        include-templates: true

    - name: Export Android APK
      run: |
        mkdir -p build/android
        # headles-сборка игры по экспортным пресетам
        godot --headless --export-release "Android" build/android/SkyWhy_Midpoint.apk
      continue-on-error: true

    - name: Create Temporary Zip Pack If Full APK Setup Pending
      run: |
        if [ ! -f build/android/SkyWhy_Midpoint.apk ]; then
          echo "Full Android SDK Build pending config. Packaging game scripts architecture instead."
          zip -r build/android/SkyWhy_Scripts_Project.zip . -x "*.git*"
        fi

    - name: Upload Artifact to GitHub Dashboard
      uses: actions/upload-artifact@v4
      with:
        name: SkyWhy_Android_Build
        path: build/android/*
        retention-days: 7
        
